# Single-node Garage layout for a local tutorial.
# replication_factor=1 because there is only one node.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

# Internal RPC (cluster gossip + the garage admin CLI).
# rpc_public_addr must be reachable *from the bootstrap container*, so it is the
# compose service name -- not loopback.
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "objectstore:3901"
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# S3 API - this is the endpoint Spark / Trino / Polaris will talk to
[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# WebDAV - handy for poking at files in a browser
[s3_webdav]
bind_addr = "[::]:4883"
root_domain = ".webdav.garage.localhost"
admin_bind_addr = "[::]:4890"

# Admin API - used by the bootstrap script
[admin]
admin_bind_addr = "[::]:9899"
metrics_token = "none"
replication_factor_warning = 1